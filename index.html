<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>TIO 릴스 레퍼런스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: 촬영 콘티처럼 — 위에 이번 주 기간과 규칙, 가운데 9:16 레퍼런스 카드 그리드, 카드를 누르면 콘티 시트(상세) */
:root {
  --bg: #ffffff;
  --surface: #f6f7fb;
  color-scheme: light;
  --ink: #141a2e;
  --muted: #5b6382;
  --line: #dfe3ef;
  --accent: #2f4cf0;
  --accent-ink: #ffffff;
  --accent-soft: #e6eaff;
  --mark: #ffe066;
  --mark-ink: #3a2f00;
  --ok: #1f8a5b;
  --display: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* 상단 */
header { padding-block: 40px 4px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
header h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.1; margin-top: 8px; }
header h1 .hl { background: linear-gradient(transparent 58%, var(--mark) 58%); color: var(--ink); padding: 0 4px; }
.period { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 8px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; }
.period .tc { font-family: var(--mono); font-weight: 500; }
.lead { color: var(--muted); margin: 14px 0 0; }

section { padding-block: 16px; }
section > h2 { font-size: 26px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
section > h2 small { font-family: var(--body); font-size: 13px; color: var(--muted); }

/* 운영 규칙 */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.rule b { font-size: 15px; }
.rule span { color: var(--muted); font-size: 14px; }
.rule .big { font-family: var(--display); font-size: 24px; line-height: 1; color: var(--accent); }
.rule ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 2px; }

/* 필터 */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 레퍼런스 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px 14px; margin-top: 18px; }
@media (max-width: 440px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; } }
.card { all: unset; cursor: pointer; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 14px; }
.thumb { position: relative; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
.card:hover .thumb img { transform: scale(1.03); }
.num { position: absolute; top: 8px; left: 8px; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; display: grid; place-items: center; background: var(--mark); color: var(--mark-ink); font-family: var(--display); font-weight: 800; font-size: 18px; }
.kind { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(10, 14, 30, .72); color: #fff; }
.tag.copy { background: var(--accent); color: #fff; }
.card h3 { font-family: var(--body); font-weight: 700; font-size: 15px; line-height: 1.4; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .thumb img { transition: none; } }

/* 체크리스트 */
.check { display: grid; gap: 8px; margin-top: 16px; max-width: 720px; }
.check label { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.check label:has(input:checked) span { color: var(--muted); text-decoration: line-through; }
.check-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; color: var(--muted); font-size: 14px; }
.btn { font: inherit; font-size: 14px; font-weight: 700; border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

footer { padding-block: 32px 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); margin-top: 20px; }

/* 상세 시트 */
dialog { border: none; padding: 0; width: min(960px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border-radius: 18px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(8, 10, 20, .55); }
.sheet { display: grid; gap: 24px; padding: 22px; }
@media (max-width: 640px) { .sheet { padding: 18px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.sheet-head b { font-size: 15px; }
.x { all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; font-size: 22px; color: var(--muted); }
.x:hover { background: var(--bg); }
.detail { display: grid; gap: 18px; min-width: 0; align-content: start; }
.detail h3 { font-size: 28px; line-height: 1.2; }
.hook { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.block { display: grid; gap: 8px; }
.block h4 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 700; }
.block ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.callout { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a { text-decoration: none; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink); }
.links a:hover { border-color: var(--accent); color: var(--accent); }
.copybox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
.copybox code { font-family: var(--body); font-size: 14px; flex: 1 1 200px; min-width: 0; }
.toast { color: var(--ok); font-size: 13px; font-weight: 700; }
.player { display: grid; gap: 10px; align-content: start; }
@media (min-width: 641px) { .player { position: sticky; top: calc(var(--head-h, 0px) + 12px); align-self: start; } }
.sheet-head { position: sticky; top: 0; z-index: 7; background: var(--surface); }
.submit-sticky { position: sticky; bottom: 0; z-index: 6; background: var(--surface); padding-top: 10px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); margin-bottom: -22px; box-shadow: 0 -8px 16px -12px rgba(20, 26, 46, .35); }
@media (max-width: 640px) { .submit-sticky { margin-bottom: -18px; } .submit-sticky .submit h4 .hint { display: none; } }
.submit-sticky .submit { padding: 12px 14px; gap: 8px; display: grid; }
.submit-sticky .submit h4 { margin: 0; }
.share .copybox { padding: 6px 10px; }
.share-label { font-size: 12px; font-weight: 700; color: var(--muted); flex: none; }
.notes-card { background: #fff6d6; border: 2px solid var(--mark); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.notes-card h4 { margin: 0; font-size: 16px; color: var(--ink); }
.notes-card .notes-sub { font-size: 14px; margin-top: 6px; }
.notes-kind { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); }
.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: n; }
.nlist li { counter-increment: n; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: baseline; }
.nlist li::before { content: counter(n) "."; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.notes-card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: var(--ink); }
.embed { width: 100%; max-width: 100%; aspect-ratio: 9 / 15.5; border-radius: 14px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.embed iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.tabs { display: flex; gap: 6px; }
.tab { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.open-ig { font-size: 13px; font-weight: 700; text-decoration: none; }
/* 영상·유의사항 고정은 위쪽(영상+대본) 영역 안에서만. 제출하기부터는 고정이 풀린다 */
.sheet-top { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; min-width: 0; }
@media (max-width: 640px) { .sheet-top { grid-template-columns: 1fr; } .embed { max-width: 360px; } }
.hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.empty { margin: 0; color: var(--muted); font-size: 14px; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; border-left: 2px solid var(--line); }
.tl li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 10px 0 10px 14px; position: relative; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.tl .t { font-family: var(--mono); font-size: 13px; color: var(--accent); padding-top: 1px; font-variant-numeric: tabular-nums; }
.tl-body { display: grid; gap: 4px; min-width: 0; }
.tl-body b { font-size: 15px; }
.shot { color: var(--muted); font-size: 13px; }
.tl-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mode-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.mode-tab { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.mode-tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.legend { margin: 0; font-size: 12px; color: var(--muted); }
.lg-tio { color: var(--accent); }
.lg-orig { font-weight: 700; }
.say { font-size: 15px; }
.orig { font-size: 12px; color: var(--muted); }

/* 주차 */
.weekbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
.weekbar .period { margin-top: 0; }
.refresh { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; }
.refresh:disabled { opacity: .6; cursor: progress; }
.metrics-at { font-size: 12px; color: var(--muted); }
.next-week { font: inherit; font-size: 14px; font-weight: 700; margin-top: 10px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.refresh-wrap { margin-left: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@media (max-width: 640px) { .refresh-wrap { margin-left: 0; width: 100%; } }
.weeksel { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.past-note { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; }
.past-note.on { display: block; }
.tag.new { background: var(--mark); color: var(--mark-ink); }
.archive { display: grid; gap: 8px; margin-top: 14px; }
.arch { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.arch:hover { border-color: var(--accent); }
.arch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.arch b { font-family: var(--mono); font-weight: 500; }
.arch span { color: var(--muted); font-size: 13px; }
.arch .thumbs { display: flex; gap: 4px; }
.arch .thumbs img { width: 22px; height: 38px; object-fit: cover; border-radius: 4px; }
@media (max-width: 440px) { .arch .thumbs { display: none; } }
.fmt { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.amb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.sheet-wide { grid-column: 1 / -1; display: grid; gap: 18px; min-width: 0; border-top: 1px solid var(--line); padding-top: 20px; }
.amb { display: grid; gap: 6px; align-content: start; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.amb-week { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.amb-week + .amb-week { margin-top: 10px; }
.amb-week summary { cursor: pointer; font-size: 15px; }
.amb-week[open] summary { margin-bottom: 10px; }
.amb-name { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.amb-stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .card-stat { color: var(--accent); font-size: 13px; }
.card .card-stat b { font-weight: 700; }
.amb a { font-size: 12px; text-decoration: none; }
.submit { background: var(--accent-soft); border-radius: 14px; padding: 14px; }
.sub-form { display: flex; gap: 8px; flex-wrap: wrap; }
.sub-form select, .sub-form input { font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.sub-form select { flex: 1 1 160px; }
#sub-other { flex: 1 1 140px; }
#sub-url { flex: 3 1 240px; }
.sub-msg { margin: 0; font-size: 13px; min-height: 1em; }
.sub-msg:empty { display: none; }
.share { display: grid; gap: 6px; }
.share-label { font-size: 12px; font-weight: 700; color: var(--muted); }
.share .copybox { background: var(--surface); }
.share.hl .copybox { border: 2px solid var(--ok); }
.sub-msg.ok { color: var(--ok); font-weight: 700; }
.sub-msg.err { color: #c0392b; font-weight: 700; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">TIO Ambassador · Reels Reference</div>
    <h1>티오 앰버서더 <span class="hl">릴스 레퍼런스</span></h1>
    <div class="weekbar" id="weekbar" hidden>
      <div class="period"><span id="week-kind">이번 주 레퍼런스</span><span class="tc" id="week-label"></span></div>
      <label class="sr" for="week-select" hidden>주차 선택</label>
      <select class="weeksel" id="week-select" aria-label="주차 선택"></select>
    </div>
    <div class="past-note" id="past-note"><span id="past-msg">지난 주차 레퍼런스를 보고 있어요.</span> <a href="#" id="to-current">이번 주로 돌아가기</a></div>
  </header>

  <section aria-labelledby="refs-h">
    <h2 id="refs-h"><span id="refs-title">이번 주 레퍼런스</span> <small id="count"></small></h2>
    <button class="next-week" type="button" id="next-week" hidden></button>
    <div class="filters" role="group" aria-label="레퍼런스 종류">
      <div class="refresh-wrap" hidden>
        <span class="metrics-at" id="metrics-at"></span>
        <button class="refresh" type="button" id="refresh" title="대시보드의 최신 지표를 다시 불러와요">↻ 최신 지표 불러오기</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section aria-labelledby="check-h">
    <h2 id="check-h">업로드 전 체크리스트</h2>
    <div class="check" id="check"></div>
    <div class="check-foot"><span id="check-state"></span><button class="btn" type="button" id="check-reset">체크 초기화</button></div>
  </section>

  <section aria-labelledby="arch-h" id="arch-sec">
    <h2 id="arch-h">지난 주차</h2>
    <div class="archive" id="archive"></div>
  </section>

  <footer>
    레퍼런스와 유의사항은 매주 업데이트돼요. 궁금한 점은 앰버서더 톡방에 남겨 주세요.
  </footer>
</div>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-head"><b id="sheet-label">레퍼런스</b><button class="x" type="button" id="sheet-close" aria-label="닫기">×</button></div>
  <div class="sheet" id="sheet-body"></div>
</dialog>

<script>

// ---------- 주차 ----------
const todayIso = (() => { const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); })(); // KST
// 다음 주차: 시작 전날(월요일)부터 모두에게 '주차 선택'에 보인다(처음 화면은 이번 주 그대로).
// 그 전에는 주소 끝에 #preview를 붙인 관리자 미리보기에서만 보인다.
const PREVIEW = location.hash === "#preview";
const dayBefore = (iso) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - 1); return d.toISOString().slice(0, 10); };
const openToAll = (w) => dayBefore(w.start) <= todayIso;
const visibleWeeks = DATA.weeks.filter((w) => PREVIEW || openToAll(w));
document.getElementById("weekbar").hidden = !PREVIEW;  // 주차 선택은 관리자 미리보기(#preview)에서만
const startedWeeks = DATA.weeks.filter((w) => w.start <= todayIso);
const currentWeek = startedWeeks.find((w) => todayIso <= w.end) || startedWeeks[startedWeeks.length - 1] || DATA.weeks[0];
const isUpcoming = (w) => w.start > todayIso;
let week = currentWeek;
let filter = "all";

const sel = document.getElementById("week-select");
sel.innerHTML = [...visibleWeeks].reverse().map((w) => `<option value="${esc(w.label)}">${esc(wl(w))}${w === currentWeek ? " (이번 주)" : isUpcoming(w) ? (openToAll(w) ? " (다음 주)" : " (다음 주 · 미리보기)") : ""}</option>`).join("");
sel.addEventListener("change", () => showWeek(visibleWeeks.find((w) => w.label === sel.value)));
document.getElementById("to-current").addEventListener("click", (e) => { e.preventDefault(); showWeek(currentWeek); });
window.addEventListener("hashchange", () => location.reload());

const nextWeek = DATA.weeks.find((w) => isUpcoming(w) && openToAll(w));
const nextBtn = document.getElementById("next-week");
nextBtn.addEventListener("click", () => showWeek(week === currentWeek ? nextWeek : currentWeek));
function showWeek(w) {
  if (!w) return;
  week = w;
  if (nextWeek) {
    nextBtn.hidden = false;
    nextBtn.textContent = week === currentWeek ? `👀 다음 주 레퍼런스 미리 보기 (${wl(nextWeek)}) →` : "← 이번 주 레퍼런스로 돌아가기";
  }
  const isCurrent = w === currentWeek;
  sel.value = w.label;
  document.getElementById("week-label").textContent = wl(w);
  const upcoming = isUpcoming(w);
  document.getElementById("week-kind").textContent = isCurrent ? "이번 주 레퍼런스" : upcoming ? (openToAll(w) ? "다음 주 레퍼런스" : "다음 주 미리보기") : "지난 주차";
  document.getElementById("refs-title").textContent = isCurrent ? `이번 주 레퍼런스 · ${wl(w)}` : `${wl(w)} 레퍼런스`;
  document.getElementById("past-note").classList.toggle("on", !isCurrent);
  const md = (iso) => iso.slice(5).replace("-", "/").replace(/^0/, "").replace("/0", "/");
  document.getElementById("past-msg").textContent = !upcoming ? "지난 주차 레퍼런스를 보고 있어요."
    : openToAll(w) ? `다음 주 레퍼런스예요. ${md(w.start)}(화)부터 이 레퍼런스로 진행해 주세요.`
    : `미리보기예요. 앰버서더에게는 ${md(dayBefore(w.start))}(월)부터 주차 선택에 보여요.`;
  renderGrid();
  renderArchive();
}

// ---------- 카드 ----------
const grid = document.getElementById("grid");
function tags(r, item) {
  return `${item.new ? '<span class="tag new">🆕 NEW</span>' : ""}${r.exact ? '<span class="tag copy">문구 그대로</span>' : ""}`;
}
function renderGrid() {
  const list = week.items.filter((it) => {
    const r = DATA.refs[it.id];
    return filter === "all" || (filter === "new" ? it.new : filter === "script" ? r.tl.length : r.kind === filter);
  });
  document.getElementById("count").textContent = `${list.length}개`;
  grid.innerHTML = list.length ? list.map((it) => {
    const r = DATA.refs[it.id];
    return `<button class="card" type="button" data-id="${it.id}" aria-label="${it.n}번 레퍼런스: ${esc(r.t)}">
      <div class="thumb">
        ${r.img ? `<img src="${r.img}" alt="" loading="lazy">` : ""}
        <span class="num">${it.n}</span>
        <span class="kind">${tags(r, it)}</span>
      </div>
      <h3>${it.n}. ${esc(r.t)}</h3>
      ${(() => { const l = ambList(it.id); const avg = avgViews(l); return l.length ? `<p class="card-stat">앰버서더 영상 ${l.length}개${avg != null ? ` · 평균 조회 <b>${short(avg)}</b>` : ""}</p>` : ""; })()}
    </button>`;
  }).join("") : `<p class="empty">이 조건에 맞는 레퍼런스가 없어요.</p>`;
}
document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  filter = b.dataset.f;
  renderGrid();
}));

// ---------- 지난 주차 ----------
function renderArchive() {
  const past = [...visibleWeeks].reverse().filter((w) => w !== week && !isUpcoming(w));
  document.getElementById("arch-sec").hidden = !past.length;
  document.getElementById("arch-h").textContent = week === currentWeek ? "지난 주차" : "다른 주차";
  document.getElementById("archive").innerHTML = past.map((w) => `
    <button class="arch" type="button" data-label="${esc(w.label)}">
      <div><b>${esc(wl(w))}</b>${w === currentWeek ? " · 이번 주" : ""}<br><span>레퍼런스 ${w.items.length}개 · 새로 들어온 것 ${w.items.filter((i) => i.new).length}개</span></div>
      <div class="thumbs">${w.items.slice(0, 6).map((i) => DATA.refs[i.id].img ? `<img src="${DATA.refs[i.id].img}" alt="">` : "").join("")}</div>
    </button>`).join("");
}
document.getElementById("archive").addEventListener("click", (e) => {
  const b = e.target.closest(".arch");
  if (b) { showWeek(visibleWeeks.find((w) => w.label === b.dataset.label)); window.scrollTo({ top: 0, behavior: "smooth" }); }
});

// ---------- 상세 ----------
// 원본이 여러 개면 원본마다 대본이 따로 있을 수 있다(r.tls[i]). 없으면 첫 대본(r.tl)
function scriptFor(r, i) { return (r.tls && r.tls[i] && r.tls[i].length) ? r.tls[i] : (r.tls && r.tls.length > 1 ? [] : r.tl); }
// mode: "cv" = 자소서 활용(티오 버전), "iv" = 면접 활용
let scriptMode = "cv";
function timeline(r, i = 0) {
  const rows = scriptFor(r, i);
  r = { ...r, tl: rows };
  if (!r.tl.length) {
    return "";
  }
  const hasTio = r.tl.some((x) => x.tio);
  const which = r.v.length > 1 && r.tls && r.tls.length > 1 ? ` · 레퍼런스 ${i + 1}` : "";
  const hasIv = r.tl.some((x) => x.iv);
  const mode = hasIv ? scriptMode : "cv";
  const say = (x) => (mode === "iv" ? x.iv : x.tio) || x.line || "";
  const shot = (x) => (mode === "iv" ? x.iv_shot : x.tio_shot) || x.shot || "";
  return `<div class="block"><div class="tl-head"><h4>초 단위 대본${which} <span class="hint">예시 대본이에요. 내 상황에 맞게 바꿔서 활용해도 돼요</span></h4>
    ${hasIv ? `<div class="mode-tabs" role="tablist" aria-label="대본 종류">
      <button type="button" role="tab" class="mode-tab" data-mode="cv" aria-selected="${mode === "cv"}">✍️ 자소서 활용</button>
      <button type="button" role="tab" class="mode-tab" data-mode="iv" aria-selected="${mode === "iv"}">🎤 면접 활용</button></div>` : ""}
</div>
    <ol class="tl">${r.tl.map((x) => `<li><span class="t">${esc(x.time)}</span><div class="tl-body">
      ${say(x) ? `<b class="say">${esc(say(x))}</b>` : ""}
      ${shot(x) ? `<span class="shot">🎬 ${esc(shot(x))}</span>` : ""}
    </div></li>`).join("")}</ol></div>`;
}
// 유의사항: 대본이 있으면 영상 밑 노란 카드, 없으면 오른쪽 원래 자리
const kindText = (r) => (r.kind === "structure" ? "전체 구조를 참고해서 만들어 주세요" : "후킹을 참고해서 만들어 주세요");
// 번호 목록: 번호를 글자와 같은 줄 안에 그려서 모바일에서도 잘리지 않게
const liList = (xs) => `<ol class="nlist">${xs.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>`;
function notesCard(r) {
  return `<div class="notes-card"><h4>⚠️ 유의사항</h4>
    ${r.notes.length ? liList(r.notes) : ""}${r.cta.length ? `<h4 class="notes-sub">CTA 예시</h4>${liList(r.cta)}` : ""}</div>`;
}
function notesBlock(r) {
  return `<div class="block"><h4>유의사항</h4>${r.notes.length ? liList(r.notes) : ""}</div>
    ${r.cta.length ? `<div class="block"><h4>CTA 예시</h4><div class="callout">${liList(r.cta)}</div></div>` : ""}`;
}
const scriptText = (r, i = 0) => scriptFor(r, i).map((x) => `${x.time}  ${x.tio || x.line || ""}${x.tio_shot || x.shot ? `\n      🎬 ${x.tio_shot || x.shot}` : ""}`).join("\n");

let SUBS = {};
async function loadSubs() {
  try {
    const res = await fetch(`${CFG.sbUrl}/rest/v1/ambassador_reels?select=ref_id,ambassador,url,code,week,created_at&order=created_at.desc`,
      { headers: { apikey: CFG.sbKey, Authorization: `Bearer ${CFG.sbKey}` } });
    if (!res.ok) return;

// 영상 목록 + 대시보드 지표(조회·좋아요·댓글). 조회수 높은 순
function ambList(id) {
  const r = DATA.refs[id];
  const seen = new Set(), out = [];
  for (const a of [...(SUBS[id] || []), ...(r.amb || [])]) {
    if (seen.has(a.code)) continue;
    seen.add(a.code);
    const m = CFG.metrics[a.code];
    out.push({ ...a, views: m ? m[0] : null, likes: m ? m[1] : null, comments: m ? m[2] : null });
  }
  return out.sort((x, y) => (y.views ?? -1) - (x.views ?? -1));
}
const fmt = (n) => (n == null ? "-" : n.toLocaleString("ko-KR"));
const short = (n) => (n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "만" : n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "천" : String(n));
function avgViews(list) {
  const v = list.map((a) => a.views).filter((x) => x != null);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
}

function ambBlock(list) {
  if (!list.length) return "";
  const avg = avgViews(list);
  const order = (label) => {
    if (!label) return -1e9;
    if (label === week.label) return 1e9;
    const w = DATA.weeks.find((x) => x.label === label);
    return w ? Date.parse(w.start) / 1e5 : 0;
  };
  const groups = {};
  for (const a of list) (groups[a.week || ""] ||= []).push(a);
  const labels = Object.keys(groups).sort((x, y) => order(y) - order(x));
  return `<h4>👀 다른 앰버서더들이 만든 영상 <span class="hint">전체 ${list.length}개${avg != null ? ` · 평균 조회 ${fmt(avg)}` : ""}</span></h4>
    ${labels.map((lb) => {
      const g = groups[lb];
      const gAvg = avgViews(g);
      const title = lb ? `${lb}${lb === currentWeek.label ? " (이번 주)" : ""}` : "주차 미지정";
      return `<details class="amb-week" ${lb === week.label || labels.length === 1 ? "open" : ""}>
        <summary><b>${esc(title)}</b> <span class="hint">${g.length}개${gAvg != null ? ` · 평균 조회 ${fmt(gAvg)}` : ""} · 조회수 높은 순</span></summary>
        <div class="amb-grid">${g.map(ambCard).join("")}</div>
      </details>`;
    }).join("")}`;
}
const IG_RE = /^https:\/\/(www\.)?instagram\.com\/([A-Za-z0-9_.]+\/)?(reel|reels|p)\/[A-Za-z0-9_-]+/;
function bindSubmit(id) {

      const res = await fetch(`${CFG.sbUrl}/rest/v1/ambassador_reels`, {
        method: "POST",
        headers: { apikey: CFG.sbKey, Authorization: `Bearer ${CFG.sbKey}`, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify({ week: week.label, ref_id: id, ambassador: who, url: link }),
      });
      if (res.status === 409) {
        // 어느 레퍼런스에 이미 들어가 있는지 알려 준다
        let where = "";

          const code = (link.match(/\/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/) || [])[1];
          const q = await fetch(`${CFG.sbUrl}/rest/v1/ambassador_reels?select=ref_id,week,ambassador&code=eq.${encodeURIComponent(code)}`,
            { headers: { apikey: CFG.sbKey, Authorization: `Bearer ${CFG.sbKey}` } });
          const hit = (await q.json())[0];
          if (hit) {
            const wk = DATA.weeks.find((w) => w.label === hit.week);
            const item = wk && wk.items.find((x) => x.id === hit.ref_id);
            const ref = DATA.refs[hit.ref_id];

      else if (!res.ok) { msg.className = "sub-msg err"; msg.textContent = "제출이 안 됐어요. 링크를 확인하고 다시 눌러 주세요."; }

        store.set("tio-amb-name", who);
        url.value = "";

  });
}

    tlBox.innerHTML = timeline(r, vi);
  });
  renderAmb(id);
  bindSubmit(id);
  body.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    body.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === t)));
    document.getElementById("ig").src = igEmbed(t.dataset.code);
    document.getElementById("open-ig").href = igUrl(t.dataset.code);
    vi = r.v.indexOf(t.dataset.code);
    if (r.tls && r.tls.length > 1) { document.getElementById("tl-box").innerHTML = timeline(r, vi); bindCopy(); }
  }));
  document.getElementById("copy-btn").addEventListener("click", async () => {
    const toast = document.getElementById("copy-toast");
    try { await navigator.clipboard.writeText(msg); toast.textContent = "복사됐어요"; }
    catch { const range = document.createRange(); range.selectNodeContents(document.getElementById("copy-text")); const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(range); toast.textContent = "선택됐어요. ⌘C로 복사하세요"; }
    toast.hidden = false;
  });
  if (!sheet.open) sheet.showModal();
  const fitSticky = () => {
    sheet.style.setProperty("--head-h", sheet.querySelector(".sheet-head").offsetHeight + "px");
  };
  fitSticky(); requestAnimationFrame(fitSticky);
}
grid.addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openRef(c.dataset.id); });
document.getElementById("sheet-close").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
sheet.addEventListener("close", () => { body.innerHTML = ""; }); // 닫으면 영상 재생도 멈춘다

// ---------- 체크리스트 (이 브라우저에만 저장) ----------
const checkEl = document.getElementById("check");
function renderChecks() {
  const saved = store.get("tio-ref-checks", []);
  checkEl.innerHTML = CHECKS.map((t, i) => `<label for="ck${i}"><input type="checkbox" id="ck${i}" ${saved.includes(i) ? "checked" : ""}><span>${esc(t)}</span></label>`).join("");
  updateState();
}
function updateState() {
  const done = [...checkEl.querySelectorAll("input")].filter((x) => x.checked).length;
  document.getElementById("check-state").textContent = done === CHECKS.length ? "모두 확인했어요. 업로드해도 좋아요!" : `${done} / ${CHECKS.length} 확인`;
}
checkEl.addEventListener("change", () => {
  store.set("tio-ref-checks", [...checkEl.querySelectorAll("input")].map((x, i) => (x.checked ? i : -1)).filter((i) => i >= 0));
  updateState();
});
document.getElementById("check-reset").addEventListener("click", () => { store.set("tio-ref-checks", []); renderChecks(); });

// 최신 지표: 사이트를 열 때마다 + 버튼을 누를 때 대시보드(09:00 수집)에서 다시 가져온다
const atEl = document.getElementById("metrics-at");
const refreshBtn = document.getElementById("refresh");
function showMetricsAt(text) { atEl.textContent = text; }
// 최신 지표: Apify로 매일 모으는 reel_metrics 표에서 바로 읽어 와서, 사이트에 구워 둔 숫자 위에 덮어쓴다
async function loadMetrics() {
  if (!CFG.sbUrl) return;
  try {
    const res = await fetch(`${CFG.sbUrl}/rest/v1/reel_metrics?select=code,views,likes,comments,updated_at`,
      { headers: { apikey: CFG.sbKey, Authorization: `Bearer ${CFG.sbKey}` } });
    if (!res.ok) throw new Error();
    let latest = "";
    for (const x of await res.json()) {
      CFG.metrics[x.code] = [x.views, x.likes, x.comments];
      if (x.updated_at > latest) latest = x.updated_at;
    }
    if (latest) {
      const d = new Date(latest);
      CFG.metricsAt = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")} 수집`;
    }
    renderGrid();
    if (document.querySelector("#sheet[open] #amb-box") && currentRef) renderAmb(currentRef);
  } catch {}
}
refreshBtn.addEventListener("click", () => loadMetrics());
showMetricsAt(`지표 기준: ${CFG.metricsAt}`);

showWeek(currentWeek);
renderChecks();
loadSubs().then(renderGrid);
loadMetrics();
</script>
